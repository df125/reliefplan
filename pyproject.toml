[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliefplan"
version = "0.1.0"
description = "MGH Anesthesia 5PM OR Coverage Planner"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "aiofiles>=23.0",
    "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
web = ["uvicorn[standard]>=0.23"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
reliefplan = "reliefplan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reliefplan*"]

[tool.setuptools.package-data]
reliefplan = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines in prompt strings and table literals
]

[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["E402"]  # imports follow pytest.importorskip("httpx")
