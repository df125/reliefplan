[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliefplan"
version = "0.1.0"
description = "MGH Anesthesia 5PM OR Coverage Planner"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
web = ["uvicorn[standard]>=0.23"]

[project.scripts]
reliefplan = "reliefplan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reliefplan*"]
